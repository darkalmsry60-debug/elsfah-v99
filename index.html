<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Dark GPT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{background:#212121;color:#ececec;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.header{height:50px;background:#171717;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #2f2f2f}
.title{font-size:16px;font-weight:600;color:#10a37f}
.status{font-size:12px;color:#8e8e93}
.chat-container{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:15px}
.message-row{display:flex;flex-direction:column;width:100%}
.user-row{align-items:flex-end}.bot-row{align-items:flex-start}
.message{max-width:85%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.user-message{background:#2f2f2f;color:#fff;border-bottom-right-radius:4px}
.bot-message{background:#171717;color:#ececec;border:1px solid #2f2f2f;border-bottom-left-radius:4px}
.footer{padding:10px 15px 20px;background:#212121}
.input-container{background:#2f2f2f;border:1px solid #424242;border-radius:24px;display:flex;align-items:center;padding:6px 12px;gap:8px}
textarea{flex:1;background:transparent;border:0;color:#fff;font-size:14px;resize:none;outline:0;max-height:100px;height:24px;line-height:24px}
.attach-btn,.send-btn{border:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.attach-btn{background:none;color:#b4b4b4;font-size:18px;padding:4px}
.send-btn{background:#10a37f;color:#fff;width:32px;height:32px;border-radius:50%;font-size:14px}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
input[type=file]{display:none}
.file-preview{font-size:11px;color:#10a37f;margin-bottom:5px;padding-right:15px;display:none}
</style>
</head>
<body>
<div class="header">
  <div class="title">⚡ Dark GPT</div>
  <div class="status" id="status">متصل</div>
</div>

<div class="chat-container" id="chatBox">
  <div class="message-row bot-row">
    <div class="message bot-message">مرحباً بك! أنا Dark GPT. كيف يمكنني مساعدتك اليوم؟</div>
  </div>
</div>

<div class="footer">
  <div class="file-preview" id="filePreview"></div>
  <div class="input-container">
    <label for="imageInput" class="attach-btn" title="إرفاق صورة">📎</label>
    <input type="file" id="imageInput" accept="image/*" onchange="handleFileSelect()">
    <textarea id="userInput" placeholder="اسأل Dark GPT..." rows="1"
      oninput="autoResize(this)" onkeydown="checkEnter(event)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">⬆</button>
  </div>
</div>

<script>
let selectedFile = null;

function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,100)+'px';
}
function checkEnter(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
}
function handleFileSelect(){
  const input=document.getElementById('imageInput');
  const preview=document.getElementById('filePreview');
  selectedFile=input.files[0]||null;
  if(selectedFile){
    preview.style.display='block';
    preview.innerText='📷 صورة محددة: '+selectedFile.name;
  }else{
    preview.style.display='none';
  }
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function addMessage(text, type){
  const row=document.createElement('div');
  row.className='message-row '+(type==='user'?'user-row':'bot-row');
  const msg=document.createElement('div');
  msg.className='message '+(type==='user'?'user-message':'bot-message');
  msg.textContent=text;
  row.appendChild(msg);
  const box=document.getElementById('chatBox');
  box.appendChild(row);
  box.scrollTop=box.scrollHeight;
  return msg;
}
async function sendMessage(){
  const input=document.getElementById('userInput');
  const sendBtn=document.getElementById('sendBtn');
  const prompt=input.value.trim();
  const file=selectedFile;
  if(!prompt&&!file)return;

  addMessage(prompt+(file?'\n[صورة مرفقة: '+file.name+']':''),'user');
  input.value=''; input.style.height='24px';
  document.getElementById('fileInput');
  const fileInput=document.getElementById('imageInput');
  fileInput.value=''; selectedFile=null;
  document.getElementById('filePreview').style.display='none';

  const botMsg=addMessage('جاري التفكير...','bot');
  sendBtn.disabled=true;
  document.getElementById('status').textContent='جاري الاتصال...';

  try{
    const body={message:prompt};
    if(file){
      body.image={
        mimeType:file.type,
        data:await fileToBase64(file)
      };
    }

    const response=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });

    const data=await response.json();
    if(!response.ok) throw new Error(data.error||'حدث خطأ في الخادم');
    botMsg.textContent=data.text||'لم يتم الحصول على رد.';
    document.getElementById('status').textContent='متصل';
  }catch(err){
    botMsg.textContent='حدث خطأ: '+err.message;
    document.getElementById('status').textContent='خطأ في الاتصال';
  }finally{
    sendBtn.disabled=false;
    document.getElementById('chatBox').scrollTop=document.getElementById('chatBox').scrollHeight;
  }
}
</script>
</body>
</html>
